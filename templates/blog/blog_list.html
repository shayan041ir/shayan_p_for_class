<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog lists</title>
</head>
<body>
    <h1>Blog Posts</h1>
    <ul>
        {% for blog in blog_lists %}
        <li>
            <h2>{{ blog.title }}</h2>
            <p>{{ blog.content }}</p>
            <a href="/blog/blog_detail/{{ blog.id }}">
                مشاهده جزئیات
            </a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
