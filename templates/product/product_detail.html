<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        {{ product.name }}
    </title>
</head>

<body>

    <h1>
        {{ product.name }}
    </h1>

    <p>
        {{ product.description }}
    </p>

    <h3>
        Price:
        {{ product.price }}
    </h3>

    <p>
        Category:
        {{ product.category.name }}
    </p>

    <br>

    <a href="{% url 'product_list' %}">
        بازگشت به محصولات
    </a>

</body>

</html>
