<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        {{ category.name }}
    </title>
</head>

<body>

    <h1>
        Category:
        {{ category.name }}
    </h1>


    {% for product in products %}

        <div>

            <h2>
                {{ product.name }}
            </h2>

            <p>
                {{ product.description }}
            </p>

            <p>
                Price:
                {{ product.price }}
            </p>

            <a href="{% url 'product_detail' product.id %}">
                مشاهده محصول
            </a>

        </div>

        <hr>

    {% empty %}

        <p>
            محصولی در این دسته‌بندی وجود ندارد.
        </p>

    {% endfor %}


    <br>

    <a href="{% url 'product_list' %}">
        همه محصولات
    </a>

</body>

</html>
